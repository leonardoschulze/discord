<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <header>
        <div class="Alto">

        </div>
        <div class="membro">

                    <img src="imagens/discord.png">

        </div>
        <div class="conexoes">
            <h4>Conexões</h4>
            <div class="conexoes-flex">

                    <img src="imagens/twitch.png" alt="">

                    <img src="imagens/verificado.png" alt="">
                </div>
                <div id="seta_cima">
                    <img src="imagens/seta_cima.png" alt="">

        </div>
        <div class="amigos">

            <div class="amigos-flex">
                <div id="M">
                    <img src="imagens/Matehus.png" alt="">

                <div id="G">
                    <img src="imagens/Gabriel.png" alt="">
                </div>
                <div id="P">
                    <img src="imagens/Paulo.png" alt="">
                </div>
                <div id="W">
                    <img src="imagens/Welington.png" alt="">
                </div>
                <div id="seta-direita">
                    <img src="imagens/seta_direita.png" alt="">
                </div>
            </div>

        </div>
        <div class="Nota">
            <div class="Nota-flex">
                <h3>Nota (visível apenas para você)</h3>
            </div>
            <div id="nota">
                <img src="imagens/nota.png" alt="">
            </div>
        </div>
        <br>
        <div class="Perfils">
            <h3>Seus Perfils:</h3>
            <div class="form-group">
                <label for="Perfils"></label>
                <select id="Perfilis" required>
                    <option value="">Selecione...</option>
                    <option>Leozin_da_Quebrada</option>
                    <option>Gato_do_Mato</option>
                    <option>Coelho_pega_cachorro123</option>
                    <option>Periquito_que_não_voa456</option>
                    <option>Rato_Borracheiro789</option>
                </select>
            </div>
        </div>


    </main>
    <footer>

        <div class="rodape">

            <div class="home">

                <h5>Início</h5>
            </div>

            <div class="notificacao">

                <h5>Notificações</h5>
            </div>

            <div class="perfil">

                <h5>Você</h5>
            </div>

        </div>

</html>
